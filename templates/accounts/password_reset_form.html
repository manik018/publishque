{% extends "base.html" %}

{% block title %}Reset Password | Publishque{% endblock %}

{% block content %}
<section class="rounded bg-white p-6 shadow-sm ring-1 ring-slate-200">
    <h1 class="text-2xl font-semibold">Reset password</h1>

    <form method="post" class="mt-6 space-y-5" novalidate>
        {% csrf_token %}
        {% for field in form %}
            <div>
                <label for="{{ field.id_for_label }}" class="block text-sm font-medium">{{ field.label }}</label>
                <div class="mt-1">{{ field }}</div>
                {% for error in field.errors %}
                    <p class="mt-1 text-sm text-red-700">{{ error }}</p>
                {% endfor %}
            </div>
        {% endfor %}
        <button type="submit" class="rounded bg-slate-900 px-4 py-2 text-sm font-medium text-white">
            Send reset link
        </button>
    </form>
</section>
{% endblock %}
