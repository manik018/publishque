{% extends "layout/dashboard_base.html" %}

{% block title %}{{ page_title }} | Publishque{% endblock %}

{% block dashboard_content %}
<section class="rounded bg-white p-8 text-center shadow-sm ring-1 ring-slate-200">
    <div class="mx-auto flex h-20 w-20 items-center justify-center rounded-full bg-accent/10 text-accent">
        <svg class="h-10 w-10" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7 3v4M17 3v4M4 9h16" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 5h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 14h5M8 17h8" />
        </svg>
    </div>
    <h1 class="mt-6 text-2xl font-bold text-primary">{{ page_title }}</h1>
    <p class="mx-auto mt-3 max-w-md text-sm text-slate-600">{{ message }}</p>
</section>
{% endblock %}
