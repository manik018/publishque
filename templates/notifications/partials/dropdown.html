<div class="p-3">
    <div class="flex items-center justify-between gap-3">
        <h2 class="text-sm font-semibold text-primary">Notifications</h2>
        <form method="post"
              hx-post="{% url 'notifications:mark_all_read' %}"
              hx-target="#notification-dropdown"
              hx-swap="innerHTML">
            {% csrf_token %}
            <button type="submit" class="text-xs font-medium text-accent">Mark all as read</button>
        </form>
    </div>

    <div class="mt-3 max-h-96 space-y-2 overflow-y-auto">
        {% for notification in notifications %}
            <article class="rounded border-l-4 bg-slate-50 p-3 {% if notification.level == 'success' %}border-green-500{% elif notification.level == 'warning' %}border-yellow-500{% elif notification.level == 'error' %}border-red-500{% else %}border-blue-500{% endif %}">
                <div class="flex items-start justify-between gap-2">
                    <p class="text-sm font-semibold text-slate-900">{{ notification.title }}</p>
                    {% if not notification.is_read %}
                        <span class="mt-1 h-2 w-2 rounded-full bg-accent"></span>
                    {% endif %}
                </div>
                <p class="mt-1 text-xs text-slate-600">{{ notification.message }}</p>
                <p class="mt-2 text-xs text-slate-400">{{ notification.created_at|date:"M j, g:i A" }}</p>
            </article>
        {% empty %}
            <p class="rounded bg-slate-50 p-3 text-sm text-slate-600">No notifications yet.</p>
        {% endfor %}
    </div>

    <a href="{% url 'notifications:list' %}" class="btn-outline mt-3 w-full">
        View all notifications
    </a>
</div>
