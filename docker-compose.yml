services:
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://publishque:publishque@db:5432/publishque
      DJANGO_SETTINGS_MODULE: config.settings.dev
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: publishque
      POSTGRES_USER: publishque
      POSTGRES_PASSWORD: publishque
    ports:
      - "5432:5432"

volumes:
  postgres_data:
