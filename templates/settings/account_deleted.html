{% extends "base.html" %}

{% block title %}Account Deleted | Publishque{% endblock %}

{% block content %}
<section class="rounded bg-white p-8 text-center shadow-sm ring-1 ring-slate-200">
    <h1 class="text-2xl font-semibold text-primary">Your account has been deleted</h1>
    <p class="mx-auto mt-3 max-w-md text-sm text-slate-600">Your Publishque account and related data have been removed.</p>
    <a href="{% url 'accounts:register' %}" class="mt-5 inline-flex rounded bg-accent px-4 py-2 text-sm font-semibold text-white">Create a new account</a>
</section>
{% endblock %}
